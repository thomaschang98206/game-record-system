<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>棒球逐球記錄系統 v3.5</title>
<style>
:root{
  --bg:#f2f2f2; --panel:#ffffff; --panel2:#e9e9e9; --ink:#161616; --muted:#767676;
  --line:#d9d9d9; --accent:#8a1f1f; --accent-ink:#ffffff; --danger:#8a1f1f;
  --field-bg:#e9e9e9; --field-in:#ffffff; --field-line:#161616; --base-fill:#ffffff;
  --shadow:0 1px 4px rgba(0,0,0,.08);
  --radius:10px; --mono:'SFMono-Regular',Consolas,'Courier New',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'PingFang TC','Noto Sans TC',Segoe UI,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#111111; --panel:#1b1b1b; --panel2:#262626; --ink:#f0f0f0; --muted:#9c9c9c;
    --line:#3a3a3a; --accent:#c9483a; --accent-ink:#111111;
    --field-bg:#232323; --field-in:#161616; --field-line:#e8e8e8; --base-fill:#e8e8e8;
    --shadow:0 1px 8px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"]{
  --bg:#111111; --panel:#1b1b1b; --panel2:#262626; --ink:#f0f0f0; --muted:#9c9c9c;
  --line:#3a3a3a; --accent:#c9483a; --accent-ink:#111111;
  --field-bg:#232323; --field-in:#161616; --field-line:#e8e8e8; --base-fill:#e8e8e8;
  --shadow:0 1px 8px rgba(0,0,0,.5);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-tap-highlight-color:transparent; overscroll-behavior:contain;}
body{padding-bottom:env(safe-area-inset-bottom);}
h1,h2,h3{margin:0 0 8px 0; font-weight:700; letter-spacing:.01em;}
h1{font-size:19px;} h2{font-size:15px;} h3{font-size:13px;color:var(--muted);}
p{margin:4px 0;}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;}
input,select{font-family:inherit;}
.app{max-width:1180px;margin:0 auto;padding:10px 12px 40px;}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
  padding:12px;margin-bottom:10px;box-shadow:var(--shadow);}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.col{display:flex;flex-direction:column;gap:8px;}
.spacer{flex:1;}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);border-radius:8px;
  padding:10px 14px;font-size:14px;font-weight:600;transition:transform .05s;}
.btn:active{transform:scale(.96);}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.btn.danger{background:var(--accent);color:#fff;border-color:var(--accent);}
.btn.ghost{background:transparent;}
.btn.small{padding:6px 10px;font-size:12px;}
.btn.big{padding:16px 10px;font-size:15px;}
.btn[disabled]{opacity:.3;pointer-events:none;}
.btn.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.muted{color:var(--muted);font-size:12px;}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--panel2);
  font-size:11px;color:var(--muted);border:1px solid var(--line);}
label.field{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);flex:1;min-width:100px;}
input[type=text],input[type=number],select{padding:8px;border:1px solid var(--line);
  border-radius:6px;background:var(--panel);color:var(--ink);font-size:14px;}
table{width:100%;border-collapse:collapse;font-size:12px;}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:center;}
th{background:var(--panel2);color:var(--muted);font-weight:600;}
.scorebox{font-family:var(--mono);font-weight:700;}
hr{border:none;border-top:1px solid var(--line);margin:10px 0;}
.hidden{display:none !important;}
.modal-back{position:fixed;inset:0;background:rgba(10,10,10,.55);display:flex;
  align-items:flex-end;justify-content:center;z-index:50;}
@media(min-width:700px){.modal-back{align-items:center;}}
.modal{background:var(--panel);width:100%;max-width:640px;max-height:92vh;overflow-y:auto;
  border-radius:16px 16px 0 0;padding:16px;border:1px solid var(--line);}
@media(min-width:700px){.modal{border-radius:16px;}}
.field-svg-wrap{width:100%;aspect-ratio:1/1;max-width:380px;margin:0 auto;position:relative;}
.field-svg-wrap.big{max-width:640px;}
.field-svg-wrap svg{width:100%;height:100%;touch-action:manipulation;}
.fielder-dot{cursor:pointer;}
.fielder-dot.lastpicked circle{animation:pulse .5s ease;}
@keyframes pulse{0%{r:3;opacity:.4;}60%{r:6;opacity:.9;}100%{r:3;opacity:1;}}
.runner-token{cursor:pointer;}
.runner-token.sel circle{stroke:var(--accent);stroke-width:1.2;}
.fielder-label{font-size:2.4px;fill:#fff;font-weight:700;pointer-events:none;}
.count-pill{font-family:var(--mono);font-size:22px;font-weight:800;letter-spacing:2px;}
.diamond{width:40px;height:40px;position:relative;}
.diamond i{position:absolute;width:12px;height:12px;background:var(--panel2);
  border:2px solid var(--line);transform:rotate(45deg);}
.diamond i.on{background:var(--accent);border-color:var(--accent);}
.diamond i.b1{right:0;bottom:12px;} .diamond i.b2{left:14px;top:0;} .diamond i.b3{left:0;bottom:12px;}
.zonegrid{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;max-width:240px;margin:8px auto;}
.zonecell{aspect-ratio:1/1;border:1px solid var(--line);border-radius:4px;background:var(--panel2);}
.zonecell.inzone{background:var(--panel);border-color:var(--accent);}
.zonecell.sel{background:var(--accent);}
.chainlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
.chainitem{padding:5px 8px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
  font-size:12px;font-weight:700;display:flex;gap:4px;align-items:center;}
.chainitem.err{background:var(--accent);color:#fff;border-color:var(--accent);}
.toplogo{font-size:26px;text-align:center;}
.starttitle{text-align:center;margin:6px 0 2px;}
.startsub{text-align:center;color:var(--muted);font-size:12px;margin-bottom:16px;}
.playerrow{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);}
.playerrow:last-child{border-bottom:none;}
.stepdots{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}
.stepdots span{width:8px;height:8px;border-radius:50%;background:var(--line);}
.stepdots span.on{background:var(--accent);}
.logrow{font-size:11px;padding:4px 0;border-bottom:1px dashed var(--line);}
.notice{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:12px;line-height:1.55;}
.error-editor{padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--panel2);}
.error-editor select{min-width:120px;}
.eventbtn{padding:14px 6px;font-size:13px;}
.doneChip{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);
  border:1px solid var(--line);border-radius:8px;margin-bottom:6px;font-size:13px;}
.doneChip b{font-weight:700;}
.game-grid{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;}
@media(min-width:860px){
  .game-grid{grid-template-columns:360px 1fr;}
  .game-left{position:sticky;top:8px;}
  .game-grid.field-focus{grid-template-columns:3fr 1fr;}
}
::-webkit-scrollbar{width:8px;height:8px;} ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}

.lineup-slot-row{display:grid;grid-template-columns:34px 38px minmax(0,1fr) 84px 64px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line);transition:transform .18s ease,opacity .18s ease,box-shadow .18s ease;background:var(--panel);position:relative;z-index:1;}
.lineup-slot-row:last-child{border-bottom:none;}
.lineup-drag-handle{display:flex;align-items:center;justify-content:center;height:42px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);font-size:20px;color:var(--muted);cursor:grab;user-select:none;touch-action:none;}
.lineup-drag-handle:active{cursor:grabbing;}
.lineup-slot-row.dragging{opacity:.92;z-index:5;box-shadow:0 8px 24px rgba(0,0,0,.22);transform:scale(1.015);}
.lineup-slot-row.drag-shift{transition:transform .20s cubic-bezier(.2,.8,.2,1);}
.lineup-slot-row.drag-drop{transition:transform .20s cubic-bezier(.2,.8,.2,1),opacity .16s ease;}
.lineup-player-btn{width:100%;text-align:left;min-height:42px;}
@media(max-width:620px){.lineup-slot-row{grid-template-columns:30px 34px minmax(0,1fr) 72px 56px;gap:5px}.lineup-drag-handle{height:40px}.lineup-slot-row .btn{padding-left:8px;padding-right:8px}}
</style>
</head>
<body>
<div id="app" class="app"></div>
<script>
(function(){
"use strict";

/* ============ 常數 ============ */
var POS = ['P','C','1B','2B','3B','SS','LF','CF','RF'];
var POSNUM = {P:1,C:2,'1B':3,'2B':4,'3B':5,SS:6,LF:7,CF:8,RF:9};
var POSNAME = {P:'投手',C:'捕手','1B':'一壘手','2B':'二壘手','3B':'三壘手',SS:'游擊手',LF:'左外野手',CF:'中外野手',RF:'右外野手'};

/* 場地基準點(0-100 相對座標)。一三壘落在界外線上,二壘與本壘同一中線。 */
var FIELD_PTS = { home:{x:50,y:95}, first:{x:70,y:74}, second:{x:50,y:53}, third:{x:30,y:74},
  fenceL:{x:6,y:48}, fenceR:{x:94,y:48}, inL:{x:22,y:34}, inR:{x:78,y:34} };

var DEFAULT_PRESETS = {
  deep:{label:'深守(向後)',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:73,y:58},'2B':{x:67,y:44},'3B':{x:27,y:58},SS:{x:33,y:44},LF:{x:10,y:22},CF:{x:50,y:10},RF:{x:90,y:22}}},
  normal:{label:'正常',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:69,y:64},'2B':{x:63,y:50},'3B':{x:31,y:64},SS:{x:37,y:50},LF:{x:14,y:32},CF:{x:50,y:18},RF:{x:86,y:32}}},
  doublePlay:{label:'雙殺站位',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:69,y:63},'2B':{x:60,y:52},'3B':{x:30,y:64},SS:{x:40,y:50},LF:{x:14,y:32},CF:{x:50,y:18},RF:{x:86,y:32}}},
  inHalf:{label:'向前守半',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:65,y:70},'2B':{x:61,y:58},'3B':{x:35,y:70},SS:{x:39,y:58},LF:{x:14,y:32},CF:{x:50,y:18},RF:{x:86,y:32}}},
  inFull:{label:'向前守全',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:61,y:73},'2B':{x:59,y:61},'3B':{x:39,y:73},SS:{x:41,y:61},LF:{x:14,y:32},CF:{x:50,y:18},RF:{x:86,y:32}}},
  pullShift:{label:'左打拉打偏移',pos:{P:{x:50,y:78},C:{x:50,y:90},'1B':{x:74,y:64},'2B':{x:68,y:54},'3B':{x:38,y:66},SS:{x:45,y:50},LF:{x:20,y:34},CF:{x:58,y:15},RF:{x:92,y:28}}}
};

var PITCH_TYPES = ['直球','快速變化球','慢速變化球'];
var PITCH_RESULTS = [
  {k:'ball',label:'壞球'},{k:'strike_look',label:'好球-看'},{k:'strike_swing',label:'好球-揮空'},
  {k:'foul',label:'界外'},{k:'hbp',label:'觸身球'},{k:'inplay',label:'擊球入場'}
];
var POWER_OPTS = ['強勁','正常','軟弱','切到'];
var TRAJ_OPTS = ['滾地','平飛','高飛','內野高飛'];
var ERROR_TYPES = ['未分類','接球失誤','傳球失誤','漏接/後逸','判斷/處理失誤','其他'];
var ERROR_EFFECTS = ['依跑壘結果','無額外推進','打者額外推進','壘上跑者額外推進','造成額外得分','其他'];
var BATTER_OUTCOMES = ['1B','2B','3B','HR','ROE','FC','SF','SH','GIDP','一般出局'];
var OUTCOME_LABEL = {'1B':'一壘安打','2B':'二壘安打','3B':'三壘安打','HR':'全壘打','ROE':'失誤上壘',
  'FC':'野手選擇','SF':'高飛犧牲打','SH':'犧牲觸擊','GIDP':'雙殺打','一般出局':'一般出局','三振看':'三振(看)','三振揮':'三振(揮)'};

var BIP_LABEL = {power:'力道', trajectory:'軌跡', landing:'落點', trigger:'觸發點', chain:'處理/傳球鏈', outcome:'打者結果', runners:'跑壘結果'};

/* ============ 資料層 ============ */
var LSKEY = 'bb_scorekeeper_v2';
var BACKUP_KEY = 'bb_scorekeeper_v2_auto_backup';
var UNDO_PREFIX = 'bb_scorekeeper_v2_undo_';
var XLSX_CACHE_KEY = 'bb_xlsx_0_18_5_cache';
var XLSX_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadDB(){
  try{ var raw = localStorage.getItem(LSKEY); if(raw) return JSON.parse(raw); }catch(e){}
  return {roster:[], presets: JSON.parse(JSON.stringify(DEFAULT_PRESETS)), games:{}, order:[]};
}
function saveDB(){ try{ localStorage.setItem(LSKEY, JSON.stringify(DB)); }catch(e){} }
function deepClone(v){ return JSON.parse(JSON.stringify(v)); }
function checkpointDB(label){
  try{
    localStorage.setItem(BACKUP_KEY, JSON.stringify({version:1, ts:Date.now(), label:label||'自動備份', db:deepClone(DB)}));
  }catch(e){}
}
function readAutoBackup(){
  try{ var raw=localStorage.getItem(BACKUP_KEY); return raw?JSON.parse(raw):null; }catch(e){ return null; }
}
function readUndoStack(g){
  if(!g) return [];
  try{
    var raw=localStorage.getItem(UNDO_PREFIX+g.id); if(!raw) return [];
    var parsed=JSON.parse(raw);
    if(Array.isArray(parsed)) return parsed;
    if(parsed && Array.isArray(parsed.stack)) return parsed.stack;
    if(parsed && parsed.game) return [parsed]; // migrate v3.1-v3.3 single-step undo
  }catch(e){}
  return [];
}
function writeUndoStack(g,stack){
  if(!g) return;
  try{ localStorage.setItem(UNDO_PREFIX+g.id, JSON.stringify({version:2,stack:stack})); }catch(e){}
}
function captureGameUndo(g,label){
  if(!g) return;
  checkpointDB(label||'比賽操作前');
  var stack=readUndoStack(g);
  stack.push({ts:Date.now(),label:label||'上一動作',game:deepClone(g)});
  if(stack.length>120) stack=stack.slice(stack.length-120);
  writeUndoStack(g,stack);
}
function getGameUndo(g){
  var stack=readUndoStack(g); return stack.length?stack[stack.length-1]:null;
}
function getGameUndoCount(g){ return readUndoStack(g).length; }
function undoLastGameAction(){
  var g=currentGame(), stack=readUndoStack(g);
  if(!g||!stack.length){ alert('目前沒有可撤銷的動作'); return; }
  var u=stack[stack.length-1];
  if(!confirm('回到上一步：撤銷「'+(u.label||'上一動作')+'」？\n目前還可往回 '+stack.length+' 步')) return;
  checkpointDB('撤銷前安全備份');
  stack.pop();
  DB.games[g.id]=u.game;
  writeUndoStack(DB.games[g.id],stack);
  saveDB(); UI.bip=null; UI.wizard=null; UI.modal=null; UI.adjustDefense=false; UI.pickedFielder=null; render();
}
var PRESETS_VERSION = 5;
var DB = loadDB();
if(!DB.presets || DB.presetsVersion!==PRESETS_VERSION){ DB.presets = JSON.parse(JSON.stringify(DEFAULT_PRESETS)); DB.presetsVersion = PRESETS_VERSION; }
if(!DB.roster) DB.roster = [];
if(!DB.games) DB.games = {};
if(!DB.order) DB.order = Object.keys(DB.games);
saveDB();

function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function round1(n){ return Math.round(n*10)/10; }

/* ============ 應用狀態 ============ */
var UI = { route:'start', gameId:null, setup:null, modal:null, adjustDefense:false, pickedFielder:null, bip:null };

function currentGame(){ return UI.gameId ? DB.games[UI.gameId] : null; }
function battingSideOf(g){ return g.state.half==='top' ? 'away':'home'; }
function fieldingSideOf(g){ return g.state.half==='top' ? 'home':'away'; }
function currentBatter(g){ var side=battingSideOf(g); return g.teams[side].lineup[g.state.battingIndex[side]]; }
function baseSnapshot(st){ return {1:st.bases[1],2:st.bases[2],3:st.bases[3]}; }
function playerNameById(g, id){
  var all = g.teams.home.lineup.concat(g.teams.home.bench, g.teams.away.lineup, g.teams.away.bench);
  var f = all.find(function(p){return p.id===id;});
  return f ? f.name : '未知球員';
}
function teamPitcher(team){
  if(!team) return null;
  return team.lineup.find(function(p){return p.pos==='P';}) ||
    (team.pitcherId ? team.bench.find(function(p){return p.id===team.pitcherId;}) : null);
}

function render(){
  var app = document.getElementById('app');
  var html = '';
  if(UI.route==='start') html = renderStart();
  else if(UI.route==='roster') html = renderRoster();
  else if(UI.route==='presets') html = renderPresets();
  else if(UI.route==='setup') html = renderSetup();
  else if(UI.route==='game') html = renderGame();
  else if(UI.route==='end') html = renderEnd();
  app.innerHTML = html;
  renderModal();
  bindGlobalHandlers();
}

/* ================= 起始畫面 ================= */
function renderStart(){
  var list = DB.order.map(function(id){return DB.games[id];}).filter(Boolean)
    .sort(function(a,b){ return (b.updatedAt||0)-(a.updatedAt||0); });
  var rows = list.map(function(g){
    var st = g.finished ? '已結束' : ('進行中 · 第'+g.state.inning+'局'+(g.state.half==='top'?'上':'下'));
    return '<div class="playerrow">'+
      '<div style="flex:1"><b>'+esc(g.teams.away.name)+'</b> @ <b>'+esc(g.teams.home.name)+'</b>'+
      '<div class="muted">'+esc(g.date||'')+' · '+st+'</div></div>'+
      '<button class="btn small" data-act="openGame" data-id="'+g.id+'">開啟</button>'+
      '<button class="btn small danger" data-act="delGame" data-id="'+g.id+'">刪除</button>'+
      '</div>';
  }).join('') || '<p class="muted">尚無比賽紀錄</p>';

  return ''+
  '<div class="toplogo">⚾</div>'+
  '<h1 class="starttitle" style="text-align:center;font-size:22px;">棒球逐球記錄系統</h1>'+
  '<div class="startsub">個人版 · 事件式記錄 · 匯出 Excel / JSON</div>'+
  '<div class="card">'+
    '<h2>比賽</h2>'+
    '<div class="row">'+
      '<button class="btn primary" data-act="newGame">＋ 新建比賽</button>'+
      '<button class="btn" data-act="goRoster">球員名單庫</button>'+
      '<button class="btn" data-act="goPresets">防守陣型預設</button>'+
    '</div>'+
  '</div>'+ 
  '<div class="card"><h2>備份 / 復原</h2><div class="row">'+
    '<button class="btn small" data-act="exportBackup">匯出完整備份</button>'+
    '<button class="btn small" data-act="importBackup">匯入備份</button>'+
    '<button class="btn small" data-act="restoreAutoBackup"'+(readAutoBackup()?'':' disabled')+'>復原上次自動備份</button>'+
    '<input id="backup-file" type="file" accept="application/json,.json" class="hidden">'+
  '</div><p class="muted">自動備份保存「上一個重要操作前」的完整資料；若清除瀏覽器資料仍會一起消失，請定期下載完整備份。</p></div>'+ 
  '<div class="card"><h2>比賽紀錄</h2>'+rows+'</div>'+
  '<p class="muted" style="text-align:center;">資料儲存在此瀏覽器裝置上,清除瀏覽器資料會遺失紀錄,請記得匯出備份。</p>';
}

/* ================= 球員名單庫 ================= */
function renderRoster(){
  var rows = DB.roster.map(function(p){
    return '<div class="playerrow"><span class="tag">#'+esc(p.number||'-')+'</span>'+
      '<div style="flex:1">'+esc(p.name)+'</div>'+
      '<button class="btn small danger" data-act="delRosterPlayer" data-id="'+p.id+'">刪除</button></div>';

function nckuPlayerId(name){
  var hex='';
  for(var i=0;i<name.length;i++) hex+=name.charCodeAt(i).toString(16);
  return 'p_ncku_'+hex;
}
function ensureNckuRoster(){
  var seen={};
  NCKU_ROSTER.forEach(function(r){
    var num=r[0], name=r[1], pid=nckuPlayerId(name);
    var matches=DB.roster.filter(function(p){ return p.id===pid || p.personId===pid || p.name===name; });
    var p=matches.length?matches[matches.length-1]:null;
    if(!p){ p={id:pid,personId:pid,name:name,number:num}; DB.roster.push(p); }
    p.id=pid; p.personId=pid; p.name=name;
    if(num!=='') p.number=num;
    seen[pid]=p;
  });
  var out=[], kept={};
  DB.roster.forEach(function(p){
    var npid = NCKU_ROSTER.some(function(r){return r[1]===p.name;}) ? nckuPlayerId(p.name) : (p.personId||p.id);
    if(npid && seen[npid]){
      if(kept[npid]) return;
      kept[npid]=true; out.push(seen[npid]);
    } else { if(!p.personId) p.personId=p.id; out.push(p); }
  });
  DB.roster=out;
  saveDB();
  return seen;
}
function migrateNckuRosterIdentity(){
  var nmap={}; NCKU_ROSTER.forEach(function(r){nmap[r[1]]=r[0];});
  var out=[], kept={}, changed=false;
  DB.roster.forEach(function(p){
    if(Object.prototype.hasOwnProperty.call(nmap,p.name)){
      var pid=nckuPlayerId(p.name);
      if(p.id!==pid || p.personId!==pid){ changed=true; p.id=pid; p.personId=pid; }
      if(nmap[p.name]!=='' && p.number!==nmap[p.name]){ p.number=nmap[p.name]; changed=true; }
      if(kept[pid]){ changed=true; return; }
      kept[pid]=true;
    } else if(!p.personId){ p.personId=p.id; changed=true; }
    out.push(p);
  });
  if(changed){ DB.roster=out; saveDB(); }
}

function ensureSetupLineupSlots(t){
  if(!t._lineupSlots){
    t._lineupSlots=new Array(9).fill(null);
    (t.lineup||[]).slice(0,9).forEach(function(pl,i){ t._lineupSlots[i]=pl; });
  }
  if(t._lineupSlots.length!==9){
    var fixed=new Array(9).fill(null);
    t._lineupSlots.slice(0,9).forEach(function(pl,i){ fixed[i]=pl; });
    t._lineupSlots=fixed;
  }
  t.lineup=t._lineupSlots.filter(Boolean);
  return t._lineupSlots;
}

  if(t&&t._lineupSlots) t.lineup=t._lineupSlots.filter(Boolean);

/* ================= 場地 SVG(無紅土,只有內外野交界線與壘包) ================= */
function fieldSvg(opts){
  opts = opts||{};
  var positions = opts.positions || {};
  var mode = opts.mode || 'view'; // 'view' | 'preset' | 'point' | 'chain'
  var extraPts = opts.extraPts || [];
  var svgId = opts.id || 'view';
  var hideFielders = !!opts.hideFielders;
  var chainMarks = opts.chainMarks || null;
  var H=FIELD_PTS.home, F=FIELD_PTS.first, S=FIELD_PTS.second, T=FIELD_PTS.third;
  var FL=FIELD_PTS.fenceL, FR=FIELD_PTS.fenceR, IL=FIELD_PTS.inL, IR=FIELD_PTS.inR;

  var dots = hideFielders ? '' : POS.map(function(p){
    var xy = positions[p] || DEFAULT_PRESETS.normal.pos[p];
    var fixed = (p==='P'||p==='C');
    var op = (mode==='preset' && fixed) ? ' opacity="0.5"' : '';
    var used = chainMarks ? chainMarks.filter(function(c){return c.pos===p;}) : [];
    var isUsed = used.length>0;
    var hasErr = used.some(function(c){return c.error;});
    var isLast = chainMarks && chainMarks.length && chainMarks[chainMarks.length-1].pos===p;
    var fill = isUsed ? (hasErr?'var(--accent)':'var(--ink)') : 'var(--accent)';
    var cls = 'fielder-dot'+(isLast?' lastpicked':'');
    return '<g class="'+cls+'" data-pos="'+p+'" data-svg="'+svgId+'" data-x="'+xy.x+'" data-y="'+xy.y+'"'+op+'>'+
      '<circle cx="'+xy.x+'" cy="'+xy.y+'" r="2.2" fill="'+fill+'" stroke="var(--field-line)" stroke-width="0.4"/>'+
      '<text class="fielder-label" x="'+xy.x+'" y="'+(xy.y+0.85)+'" text-anchor="middle">'+POSNUM[p]+'</text>'+
      '</g>';
  }).join('');
  var pts = extraPts.map(function(p){
    return '<g><circle cx="'+p.x+'" cy="'+p.y+'" r="2" fill="'+(p.color||'var(--ink)')+'" stroke="var(--panel)" stroke-width="0.5"/>'+
      (p.label?'<text x="'+p.x+'" y="'+(p.y-3.4)+'" text-anchor="middle" font-size="4" fill="var(--ink)" font-weight="700">'+p.label+'</text>':'')+'</g>';
  }).join('');

  return '<div class="field-svg-wrap'+(opts.big?' big':'')+'"><svg data-svg="'+svgId+'" data-mode="'+mode+'" viewBox="0 0 100 100">'+
    '<rect x="0" y="0" width="100" height="100" fill="var(--field-bg)"/>'+
    '<path d="M'+H.x+','+H.y+' L'+FL.x+','+FL.y+' A80,80 0 0 1 '+FR.x+','+FR.y+' Z" fill="var(--field-bg)"/>'+
    '<path d="M'+H.x+','+H.y+' L'+IL.x+','+IL.y+' A46,46 0 0 1 '+IR.x+','+IR.y+' Z" fill="var(--field-in)" stroke="var(--field-line)" stroke-width="0.4"/>'+
    '<line x1="'+H.x+'" y1="'+H.y+'" x2="'+FL.x+'" y2="'+FL.y+'" stroke="var(--field-line)" stroke-width="0.4"/>'+
    '<line x1="'+H.x+'" y1="'+H.y+'" x2="'+FR.x+'" y2="'+FR.y+'" stroke="var(--field-line)" stroke-width="0.4"/>'+
    baseRect(H.x,H.y)+baseRect(F.x,F.y)+baseRect(S.x,S.y)+baseRect(T.x,T.y)+
    pts + dots +
    '</svg></div>';
}
function baseRect(cx,cy){
  return '<rect x="'+(cx-1.3)+'" y="'+(cy-1.3)+'" width="2.6" height="2.6" fill="var(--base-fill)" stroke="var(--field-line)" stroke-width="0.4" transform="rotate(45 '+cx+' '+cy+')"/>';
}

/* ================= 新比賽建立 ================= */
function newGame(){
  var s = UI.setup;
  ['home','away'].forEach(function(side){ if(s[side]&&s[side]._lineupSlots) syncSetupLineupSlots(s[side]); s[side].lineup=(s[side].lineup||[]).slice(0,9); });
  if(s.home.lineup.length<1 || s.away.lineup.length<1){ alert('雙方至少需要 1 位球員才能開始'); return; }
  var id = uid('game');
  function buildTeam(side){
    var bench = s[side].bench.map(cloneP);
    var pitcherId = null;
    if(s[side].pitcherOnly){
      var po = cloneP(s[side].pitcherOnly);
      bench.push(po); pitcherId = po.id;
    }
    return {name:s[side].name, lineup:s[side].lineup.map(cloneP), bench:bench,
      defense: JSON.parse(JSON.stringify(DB.presets[s.startingDefense[side]].pos)), defensePresetKey:s.startingDefense[side],
      pitcherId: pitcherId};
  }
  var g = {
    id:id, date:s.date, innings:s.innings, updatedAt:Date.now(), finished:false,
    teams:{ home: buildTeam('home'), away: buildTeam('away') },
    state:{
      inning:1, half:'top', outs:0, balls:0, strikes:0,
      bases:{1:null,2:null,3:null}, battingIndex:{home:0, away:0},
      score:{home:[], away:[]}, hits:{home:0,away:0}, errors:{home:0,away:0},
      defense: JSON.parse(JSON.stringify(DB.presets[s.startingDefense.home].pos)),
      selPitchType:null, selZone:null, atBatSeq:0
    },
    events:[]
  };
  checkpointDB('建立新比賽前');
  DB.games[id]=g; if(DB.order.indexOf(id)===-1) DB.order.push(id);
  saveDB();
  UI.gameId=id; UI.setup=null; UI.route='game';
  render();
}
function cloneP(p){ return {id:p.id, personId:p.personId||p.id, name:p.name, number:p.number, pos:p.pos}; }

function switchHalfIfNeeded(g){
  var st = g.state;
  if(st.outs>=3){
    st.outs=0; st.balls=0; st.strikes=0; st.bases={1:null,2:null,3:null};
    if(st.half==='top'){ st.half='bottom'; } else { st.half='top'; st.inning++; }
    var newFieldingSide = st.half==='top' ? 'home' : 'away';
    st.defense = JSON.parse(JSON.stringify(g.teams[newFieldingSide].defense));
  }
}
function ensureInningScoreSlot(g, side, inning){ var arr=g.state.score[side]; while(arr.length<inning) arr.push(0); }
function addRuns(g, side, n){ if(n<=0) return; ensureInningScoreSlot(g, side, g.state.inning); g.state.score[side][g.state.inning-1]+=n; }
function logEvent(g, ev){ ev.id=uid('ev'); ev.ts=Date.now(); g.events.push(ev); g.updatedAt=Date.now(); saveDB(); }

/* ================= 投球處理 ================= */
function handlePitchResult(kind){
  var g = currentGame(); var st = g.state;
  var battingSide = battingSideOf(g), fieldingSide = fieldingSideOf(g);
  var batter = currentBatter(g);
  if(!batter){ alert('目前沒有打者'); return; }
  var basesBefore = baseSnapshot(st);
  var before = {outs:st.outs, balls:st.balls, strikes:st.strikes};

  if(kind==='inplay'){ openBip(); return; }
  captureGameUndo(g, '投球：'+(PITCH_RESULTS.find(function(x){return x.k===kind;})||{label:kind}).label);

  var ev = {
    type:'pitch', battingTeam:battingSide, fieldingTeam:fieldingSide,
    batterId:batter.id, batterName:batter.name,
    inningBefore:st.inning, halfBefore:st.half, outsBefore:before.outs,
    ballsBefore:before.balls, strikesBefore:before.strikes, basesBefore:basesBefore,
    pitchType: st.selPitchType, zone: st.selZone, pitchResult: kind
  };
  if(kind==='ball'){
    st.balls++; ev.summary=batter.name+' 壞球 ('+st.strikes+'-'+st.balls+')';
    if(st.balls>=4){ ev.finalOutcome='BB'; ev.outsAfter=st.outs; ev.summary+=' → 保送'; logEvent(g,ev); finishAtBat(g,'BB',{},ev); return; }
  } else if(kind==='strike_look' || kind==='strike_swing'){
    if(st.strikes<2){ st.strikes++; ev.summary=batter.name+' 好球('+(kind==='strike_look'?'看':'揮')+') ('+st.strikes+'-'+st.balls+')'; }
    else {
      var kType = kind==='strike_look' ? '三振看' : '三振揮';
      ev.finalOutcome=kType; ev.outsAfter=st.outs; ev.summary=batter.name+' 第三好球 → 三振出局';
      logEvent(g, ev); finishAtBat(g,kType,{},ev); return;
    }
  } else if(kind==='foul'){
    if(st.strikes<2) st.strikes++;
    ev.summary=batter.name+' 界外 ('+st.strikes+'-'+st.balls+')';
  } else if(kind==='hbp'){
    ev.finalOutcome='HBP'; ev.outsAfter=st.outs; ev.summary=batter.name+' 觸身球 → 上壘';
    logEvent(g, ev); finishAtBat(g,'HBP',{},ev); return;
  }
  ev.outsAfter=st.outs; ev.ballsAfter=st.balls; ev.strikesAfter=st.strikes;
  logEvent(g, ev); render();
}

function finishAtBat(g, outcome, extra, evToAnnotate){
  extra = extra || {};
  var battingSide = battingSideOf(g); var st = g.state; var batter = currentBatter(g);
  var basesBefore = baseSnapshot(st);
  var runsScored=0, outsAdded=0;
  var runnerResults = extra.runnerResults || defaultRunnerPlan(outcome, basesBefore);
  var newBases = {1:null,2:null,3:null};
  ['1','2','3'].forEach(function(b){
    var r=runnerResults[b]; if(!r||!basesBefore[b]) return;
    if(r.to==='out') outsAdded++;
    else if(r.to==='score') runsScored++;
    else if(r.to==='1'||r.to==='2'||r.to==='3') newBases[r.to]=basesBefore[b];
  });
  var br = runnerResults.batter;
  var isHit = ['1B','2B','3B','HR'].indexOf(outcome)>=0;
  if(br){
    if(br.to==='out') outsAdded++;
    else if(br.to==='score') runsScored++;
    else if(br.to==='1'||br.to==='2'||br.to==='3') newBases[br.to]=batter?batter.id:null;
  }
  st.bases=newBases; st.outs+=outsAdded;
  if(isHit) g.state.hits[battingSide]=(g.state.hits[battingSide]||0)+1;
  if(runsScored>0) addRuns(g, battingSide, runsScored);
  if(evToAnnotate){
    evToAnnotate.runnerPlan = runnerResults;
    evToAnnotate.runnerPlanText = describeRunnerPlan(g, runnerResults, basesBefore);
    evToAnnotate.basesAfterPlay = {1:newBases[1], 2:newBases[2], 3:newBases[3]};
    evToAnnotate.outsAfterPlay = st.outs;
    evToAnnotate.runsThisPlay = runsScored;
  }
  st.balls=0; st.strikes=0; st.selZone=null;
  st.battingIndex[battingSide]=(st.battingIndex[battingSide]+1)%g.teams[battingSide].lineup.length;
  st.atBatSeq++;
  switchHalfIfNeeded(g);
  saveDB(); render();
}

function describeRunnerPlan(g, plan, basesBefore){
  var labels={out:'出局',1:'一壘',2:'二壘',3:'三壘',score:'得分'};
  var parts=[];
  ['1','2','3'].forEach(function(b){
    if(!basesBefore[b]) return;
    var nm = playerNameById(g, basesBefore[b]);
    var to = plan[b] ? labels[plan[b].to]||plan[b].to : '留在'+b+'壘';
    parts.push(b+'壘跑者('+nm+')→'+to);
  });
  if(plan.batter){
    parts.push('打者→'+(labels[plan.batter.to]||plan.batter.to));
  }
  return parts.join('; ');
}
function defaultRunnerPlan(outcome, basesBefore){
  /* 打者的去向由結果定義,可以預先帶入;但壘上跑者一律預設「留在原壘」,
     由使用者在跑壘步驟手動指定,系統不主動猜哪個跑者出局或推進 —— 除了保送/觸身球,
     這兩種只有「強迫推進」是規則決定的(沒有判斷空間),所以保留自動強迫推進。 */
  var batterTo = '1';
  if(outcome==='2B') batterTo='2';
  else if(outcome==='3B') batterTo='3';
  else if(outcome==='HR') batterTo='score';
  else if(outcome==='SF'||outcome==='SH'||outcome==='GIDP'||outcome==='一般出局'||outcome==='三振看'||outcome==='三振揮') batterTo='out';
  var plan = {batter:{to:batterTo}};
  plan['1'] = basesBefore[1] ? {to:'1'} : undefined;
  plan['2'] = basesBefore[2] ? {to:'2'} : undefined;
  plan['3'] = basesBefore[3] ? {to:'3'} : undefined;
  if(outcome==='BB'||outcome==='HBP'){
    if(basesBefore[1]){
      plan['1'] = {to:'2'};
      if(basesBefore[2]){
        plan['2'] = {to:'3'};
        if(basesBefore[3]) plan['3'] = {to:'score'};
      }
    }
  }
  return plan;
}

function bipJump(step){

function bipDoneChips(){
  var d = UI.bip; var chips=[];
  d.history.forEach(function(st){
    var val='';
    if(st==='power') val=d.power;
    else if(st==='trajectory') val=d.trajectory;
    else if(st==='landing') val=d.landing?('('+d.landing.x+','+d.landing.y+')'):'';
    else if(st==='trigger') val=d.trigger?('('+d.trigger.x+','+d.trigger.y+')'):'';
    else if(st==='chain') val=d.chain.length?d.chain.map(function(c){return c.pos+(c.error?('⚠'+(c.errorType&&c.errorType!=='未分類'?'·'+c.errorType:'')):'');}).join('→'):'(無)';
    else if(st==='outcome') val=OUTCOME_LABEL[d.outcome]||d.outcome;
    if(!val && val!=='(無)') return;
    chips.push('<div class="doneChip"><span class="spacer">'+BIP_LABEL[st]+':<b>'+esc(val)+'</b></span><button class="btn small ghost" data-act="bipJump" data-v="'+st+'">改</button></div>');
  });
  return chips.join('');
}

  return html;
}

function bipStepHtml(g, step){
  var d = UI.bip;
  if(step==='power'){
    return '<h3>力道</h3><div class="grid4">'+POWER_OPTS.map(function(p){
      return '<button class="btn'+(d.power===p?' sel':'')+'" data-act="bipPower" data-v="'+p+'">'+p+'</button>';
    }).join('')+'</div>';
  }
  if(step==='trajectory'){
    return '<h3>軌跡</h3><div class="grid4">'+TRAJ_OPTS.map(function(t){
      return '<button class="btn'+(d.trajectory===t?' sel':'')+'" data-act="bipTraj" data-v="'+t+'">'+t+'</button>';
    }).join('')+'</div>';
  }
  if(step==='landing'){
    return '<h3>落點</h3><p class="muted">請在左側(或上方)場地圖點擊落點位置。</p>'+

  }
  if(step==='trigger'){

    var html = '<h3>觸發點</h3><p class="muted">請在場地圖點擊觸發守備的位置。</p>';

    }).join('')+'</div>';
    var errEditors=d.chain.map(function(c,i){

      return '<div class="error-editor"><b>'+c.pos+' 失誤</b><div class="row" style="margin-top:6px;">'+
        '<label class="field">類型<select data-act="bipErrType" data-i="'+i+'">'+tOpts+'</select></label>'+
        '<label class="field">後果<select data-act="bipErrEffect" data-i="'+i+'">'+eOpts+'</select></label>'+
      '</div></div>';
    }).join('');
    return '<h3>處理 / 傳球鏈</h3><p class="muted">在場地圖點守備員；連點同一位兩下=切換失誤。失誤的「類型」與「後果」會獨立存進事件資料。</p>'+chainHtml+errEditors+
      '<div class="row" style="margin-top:8px;">'+
        '<button class="btn small" data-act="bipChainUndo"'+(d.chain.length?'':' disabled')+'>移除最後一個</button>'+
        '<button class="btn small" data-act="bipChainSkip">無人處理(如全壘打出牆)</button>'+
        '<button class="btn primary" data-act="bipChainDone">'+(d.chain.length?'完成鏈,下一步':'無守備處理,下一步')+'</button>'+
      '</div>';
  }
  if(step==='outcome'){
    var outBtns = '<div class="grid3">'+BATTER_OUTCOMES.map(function(o){
      return '<button class="btn small'+(d.outcome===o?' sel':'')+'" data-act="bipOutcome" data-v="'+o+'">'+OUTCOME_LABEL[o]+'</button>';
    }).join('')+'</div>';
    var hasErr=d.chain.some(function(c){return c.error;});
    var hitPlusErr = hasErr && ['1B','2B','3B','HR'].indexOf(d.outcome)>=0 ?
      '<div class="notice" style="margin-top:8px;"><b>安打＋失誤</b>：目前會保留「'+OUTCOME_LABEL[d.outcome]+'」並另外記守備失誤。若失誤讓打者多進壘，下一步把打者移到實際到達的壘包即可。</div>' : '';
    var extras = d.outcome ? (
      hitPlusErr+
      '<div class="row" style="margin-top:8px;">'+
      '<label style="font-size:12px;display:flex;align-items:center;gap:4px;"><input type="checkbox" data-act="bipBunt" '+(d.isBunt?'checked':'')+'> 觸擊安打(標記用)</label>'+
      '<label style="font-size:12px;display:flex;align-items:center;gap:4px;"><input type="checkbox" data-act="bipROE" '+(d.batterROE?'checked':'')+'> 本打席判定為 ROE：主要因失誤上壘，不算安打</label>'+
      '</div>'+
      '<label class="field" style="margin-top:6px;max-width:140px;">打點 RBI<input type="number" id="bip-rbi" value="'+(d.rbi||0)+'" min="0" max="4"></label>'+
      '<div class="row" style="margin-top:10px;"><button class="btn primary" data-act="bipToRunners">下一步:確認跑壘 →</button></div>'
    ) : '';
    return '<h3>打者結果</h3>'+outBtns+extras;
  }
  if(step==='runners'){
    var basesBefore = baseSnapshot(g.state);
    var plan = d.runnerPlan;
    function options(cur){
      var opts=['out','1','2','3','score']; var labels={out:'出局',1:'一壘',2:'二壘',3:'三壘',score:'得分'};
      return opts.map(function(o){return '<option value="'+o+'"'+(cur===o?' selected':'')+'>'+labels[o]+'</option>';}).join('');
    }
    var rows='';
    ['3','2','1'].forEach(function(b){
      if(!basesBefore[b]) return;
      var name = playerNameById(g, basesBefore[b]);
      var cur = plan[b]?plan[b].to:b;
      rows += '<div class="row"><div style="flex:1">'+b+'壘跑者:'+esc(name)+'</div><select data-act="bipRunnerSel" data-b="'+b+'">'+options(cur)+'</select></div>';
    });
    var batterName = currentBatter(g)?currentBatter(g).name:'';
    var curB = plan.batter?plan.batter.to:'1';
    rows += '<div class="row"><div style="flex:1">打者:'+esc(batterName)+'</div><select data-act="bipRunnerSel" data-b="batter">'+options(curB)+'</select></div>';
    var selInfo = d.selectedRunner ? ('<div class="row" style="margin-bottom:8px;"><span class="tag">已選取:'+(d.selectedRunner==='batter'?'打者':d.selectedRunner+'壘跑者')+'</span><button class="btn small danger" data-act="bipRunnerOut">判出局</button></div>') : '<p class="muted">在左側場地點一位跑者(或打者),再點目標壘包快速指定;或直接用下方選單調整。</p>';
    return '<h3>確認跑壘結果</h3>'+selInfo+rows+
      '<div class="row" style="margin-top:10px;"><button class="btn primary" data-act="bipConfirm">確認完成本次記錄</button></div>';
  }
  return '';
}

}

function bipChainSkip(){ UI.bip.chain=[]; bipGo('outcome'); }

function bipOutcome(v){ UI.bip.outcome=v; UI.bip.batterROE=(v==='ROE'); render(); }
function bipToRunners(){

function bipConfirmFinal(){
  var g=currentGame(); var d=UI.bip;
  var battingSide=battingSideOf(g); var basesBefore=baseSnapshot(g.state);
  var before={outs:g.state.outs, balls:g.state.balls, strikes:g.state.strikes};

  var officialOutcome=d.batterROE?'ROE':d.outcome;
  captureGameUndo(g, '擊球入場：'+(OUTCOME_LABEL[officialOutcome]||officialOutcome));
  var ev = {
    type:'battedball', battingTeam:battingSide, fieldingTeam:fieldingSideOf(g),
    batterId:batter?batter.id:null, batterName:batter?batter.name:'',
    inningBefore:g.state.inning, halfBefore:g.state.half, outsBefore:before.outs,
    ballsBefore:before.balls, strikesBefore:before.strikes, basesBefore:basesBefore,
    power:d.power, trajectory:d.trajectory, landing:d.landing, trigger:d.trigger,
    chain:d.chain, chainStr:d.chain.map(function(c){return POSNUM[c.pos]+(c.error?'E':'');}).join('-'),
    errorDetails:d.chain.filter(function(c){return c.error;}).map(function(c){return {pos:c.pos,type:c.errorType||'未分類',effect:c.errorEffect||'依跑壘結果'};}),
    outcome:officialOutcome, selectedOutcome:d.outcome, isBunt:!!d.isBunt, batterROE:!!d.batterROE, rbi:d.rbi||0, finalOutcome:officialOutcome
  };
  var fErrCount = ev.errorDetails.length;
  if(fErrCount>0) g.state.errors[fieldingSideOf(g)]=(g.state.errors[fieldingSideOf(g)]||0)+fErrCount;
  ev.notation = buildNotation(ev);
  ev.summary = (ev.batterName||'打者')+' '+(OUTCOME_LABEL[ev.outcome]||ev.outcome)+'('+ev.notation+')'+(ev.rbi?(' 打點'+ev.rbi):'')+(fErrCount>0?' [守備失誤×'+fErrCount+']':'');
  logEvent(g, ev);
  UI.bip = null;
  finishAtBat(g, officialOutcome, {runnerResults:d.runnerPlan}, ev);
}

function bindGlobalHandlers(){
  document.body.onclick = function(ev){
    var t = ev.target.closest('[data-act]');
    if(t){ handleAct(t, ev); return; }
    var rtoken = ev.target.closest('.runner-token');
    if(rtoken){ UI.bip.selectedRunner = rtoken.dataset.runner; render(); return; }
    var btarget = ev.target.closest('.base-target');
    if(btarget){
      if(UI.bip && UI.bip.selectedRunner){
        var b = btarget.dataset.base; var to = b==='home' ? 'score' : b;
        UI.bip.runnerPlan[UI.bip.selectedRunner] = {to:to};
        UI.bip.selectedRunner = null;
      }
      render(); return;
    }
    var fielder = ev.target.closest('.fielder-dot');
    if(fielder){ handleFielderClick(fielder, ev); return; }
    var svgEl = ev.target.closest('svg[data-svg]');
    if(svgEl){ handleSvgClick(svgEl, ev); return; }
  };
  document.body.onchange = function(ev){
    var t = ev.target;
    if(t.matches('[data-act="teamName"]')) { UI.setup[t.dataset.side].name = t.value; }
    else if(t.matches('[data-act="setDate"]')) { UI.setup.date = t.value; }

    else if(t.matches('[data-act="setLineupPos"]')) { UI.setup[t.dataset.side].lineup[+t.dataset.i].pos = t.value; }
    else if(t.matches('[data-act="setRosterSlotPos"]')) { var st=UI.setup[t.dataset.side]; var sl=ensureSetupLineupSlots(st); if(sl[+t.dataset.slot]){ sl[+t.dataset.slot].pos=t.value; syncSetupLineupSlots(st); } }
    else if(t.matches('[data-act="editLineupName"]')) { UI.setup[t.dataset.side].lineup[+t.dataset.i].name = t.value; }
    else if(t.matches('[data-act="editLineupNum"]')) { UI.setup[t.dataset.side].lineup[+t.dataset.i].number = t.value; }
    else if(t.matches('[data-act="setStartDefense"]')) { UI.setup.startingDefense[t.dataset.side]=t.value; render(); }
    else if(t.matches('[data-act="wSetSel"]')) { wizardData()[t.dataset.k]=t.value; }
    else if(t.matches('[data-act="wWpAdv"]')) { var wd=wizardData(); wd.adv=wd.adv||{}; wd.adv[t.dataset.b]=t.value; }
    else if(t.matches('[data-act="wCorrChk"]')) { wizardData().chk[t.dataset.k]=t.checked; }
    else if(t.matches('[data-act="wCorrVal"]')) { wizardData().val[t.dataset.k]=t.value; }
    else if(t.matches('[data-act="bipRunnerSel"]')) { UI.bip.runnerPlan[t.dataset.b]={to:t.value}; }
    else if(t.matches('[data-act="bipBunt"]')) { UI.bip.isBunt=t.checked; }
    else if(t.matches('[data-act="bipROE"]')) { UI.bip.batterROE=t.checked; }
    else if(t.matches('[data-act="bipErrType"]')) { UI.bip.chain[+t.dataset.i].errorType=t.value; }
    else if(t.matches('[data-act="bipErrEffect"]')) { UI.bip.chain[+t.dataset.i].errorEffect=t.value; }
    else if(t.id==='backup-file') { importBackupFile(t.files&&t.files[0]); t.value=''; }
  };
  bindSetupDragHandlers();
}


function bindSetupDragHandlers(){
  var drag=null;
  function rowsFor(side){ return Array.prototype.slice.call(document.querySelectorAll('.lineup-slot-row[data-side="'+side+'"]')); }
  function clearDragVisuals(side){
    rowsFor(side).forEach(function(r){
      r.classList.remove('dragging','drag-shift','drag-drop');
      r.style.transform='';
      r.style.transition='';
      r.style.willChange='';
    });
  }
  function targetIndexForY(d, clientY){
    var y=clientY-d.grabOffsetY;
    var center=y+d.rowHeight/2;
    var to=d.from;
    for(var i=0;i<d.initialRects.length;i++){
      var rc=d.initialRects[i];
      if(center < rc.top + rc.height/2){ to=i; return to; }
      to=i;
    }
    return to;
  }
  function preview(d,to,clientY){
    var rows=d.rows, src=rows[d.from]; if(!src) return;
    d.to=to;
    var step=d.step;
    rows.forEach(function(r,i){
      if(i===d.from) return;
      r.classList.add('drag-shift');
      r.style.willChange='transform';
      var dy=0;
      if(to>d.from && i>d.from && i<=to) dy=-step;
      else if(to<d.from && i>=to && i<d.from) dy=step;
      r.style.transform='translateY('+dy+'px)';
    });
    var delta=clientY-d.startY;
    src.style.transform='translateY('+delta+'px) scale(1.015)';
  }
  document.body.onpointerdown=function(ev){
    var h=ev.target.closest('.lineup-drag-handle'); if(!h) return;
    var side=h.dataset.dragSide, from=+h.dataset.dragSlot;
    var t=UI.setup&&UI.setup[side]; if(!t) return;
    var slots=ensureSetupLineupSlots(t); if(!slots[from]) return;
    var rows=rowsFor(side), row=rows[from]; if(!row) return;
    var rects=rows.map(function(r){ var q=r.getBoundingClientRect(); return {top:q.top,left:q.left,width:q.width,height:q.height}; });
    var step=rects.length>1 ? Math.abs(rects[Math.min(from+1,rects.length-1)].top-rects[from].top) : rects[from].height;
    if(from===rects.length-1 && rects.length>1) step=Math.abs(rects[from].top-rects[from-1].top);
    drag={side:side,from:from,to:from,pointerId:ev.pointerId,startY:ev.clientY,grabOffsetY:ev.clientY-rects[from].top,rowHeight:rects[from].height,step:step,rows:rows,initialRects:rects,handle:h};
    row.classList.add('dragging');
    row.style.willChange='transform';
    row.style.transition='none';
    try{h.setPointerCapture(ev.pointerId);}catch(e){}
    ev.preventDefault();
  };
  document.body.onpointermove=function(ev){
    if(!drag || ev.pointerId!==drag.pointerId) return;
    ev.preventDefault();
    var to=targetIndexForY(drag,ev.clientY);
    preview(drag,to,ev.clientY);
  };
  document.body.onpointerup=function(ev){
    if(!drag || ev.pointerId!==drag.pointerId) return;
    ev.preventDefault();
    var d=drag; drag=null;
    var src=d.rows[d.from], to=d.to;
    try{d.handle.releasePointerCapture(d.pointerId);}catch(e){}
    if(to===d.from){
      if(src){ src.classList.add('drag-drop'); src.style.transition='transform .18s cubic-bezier(.2,.8,.2,1), box-shadow .18s ease'; src.style.transform='translateY(0) scale(1)'; }
      setTimeout(function(){ clearDragVisuals(d.side); },190);
      return;
    }
    var finalDelta=d.initialRects[to].top-d.initialRects[d.from].top;
    if(src){
      src.classList.add('drag-drop');
      src.style.transition='transform .20s cubic-bezier(.2,.8,.2,1), box-shadow .20s ease';
      src.style.transform='translateY('+finalDelta+'px) scale(1.015)';
    }
    setTimeout(function(){
      var t=UI.setup&&UI.setup[d.side]; if(!t) return;
      var slots=ensureSetupLineupSlots(t).slice(0,9);
      var item=slots.splice(d.from,1)[0];
      slots.splice(to,0,item);
      while(slots.length<9) slots.push(null);
      t._lineupSlots=slots.slice(0,9);
      syncSetupLineupSlots(t);
      render();
    },205);
  };
  document.body.onpointercancel=function(ev){
    if(!drag) return;
    var d=drag; drag=null;
    try{d.handle.releasePointerCapture(d.pointerId);}catch(e){}
    clearDragVisuals(d.side);
  };
}

function handleAct(t, ev){
  var act = t.dataset.act;
  switch(act){
    case 'newGame': UI.setup=null; UI.route='setup'; render(); break;
    case 'goStart': UI.route='start'; UI.setup=null; render(); break;
    case 'goRoster': UI.route='roster'; render(); break;
    case 'goPresets': UI.route='presets'; render(); break;
    case 'openGame': UI.gameId=t.dataset.id; UI.route = DB.games[t.dataset.id].finished?'end':'game'; render(); break;
    case 'delGame': if(confirm('確定刪除這場比賽紀錄?')){ checkpointDB('刪除比賽前'); delete DB.games[t.dataset.id]; DB.order=DB.order.filter(function(x){return x!==t.dataset.id;}); saveDB(); render(); } break;
    case 'addRosterPlayer': { var name=document.getElementById('np-name').value.trim(); var num=document.getElementById('np-num').value.trim(); if(!name) return; checkpointDB('新增球員前'); var pid=uid('p'); DB.roster.push({id:pid,personId:pid, name:name, number:num}); saveDB(); render(); break; }
    case 'delRosterPlayer': checkpointDB('刪除球員前'); DB.roster=DB.roster.filter(function(p){return p.id!==t.dataset.id;}); saveDB(); render(); break;
    case 'loadNckuRoster': { checkpointDB('匯入成大名單前'); ensureNckuRoster(); render(); break; }
    case 'addFromRoster': { var side=t.dataset.side; var sel=document.getElementById('pick-'+side); var pid=sel.value; if(!pid) return; var p=DB.roster.find(function(x){return x.id===pid;}); UI.setup[side].lineup.push({id:p.id, name:p.name, number:p.number, pos:nextOpenPos(UI.setup[side].lineup)}); render(); break; }
    case 'addManual': { var side2=t.dataset.side; var nm=document.getElementById('add-name-'+side2).value.trim(); var nu=document.getElementById('add-num-'+side2).value.trim(); if(!nm) return; UI.setup[side2].lineup.push({id:uid('p'), name:nm, number:nu, pos:nextOpenPos(UI.setup[side2].lineup)}); render(); break; }
    case 'quickDefaultLineup': {
      var side5=t.dataset.side;
      if(UI.setup[side5].lineup.length && !confirm('將覆蓋目前已輸入的棒次,確定嗎?')) return;
      UI.setup[side5].lineup = POS.map(function(p,i){ return {id:uid('p'), name:'DEFAULT'+(i+1), number:'', pos:p}; });
      UI.setup[side5]._lineupSlots=new Array(9).fill(null); UI.setup[side5].lineup.forEach(function(pl,i){UI.setup[side5]._lineupSlots[i]=pl;});
      render(); break;
    }
    case 'loadNckuPreset': {
      var sideN=t.dataset.side;
      if(UI.setup[sideN].lineup.length && !confirm('將覆蓋目前已輸入的棒次,確定嗎?')) return;
      var nmap=ensureNckuRoster();
      UI.setup[sideN].lineup = NCKU_LINEUP.slice(0,9).map(function(l){ var rp=nmap[nckuPlayerId(l.name)]; return {id:rp?rp.id:nckuPlayerId(l.name), personId:rp?(rp.personId||rp.id):nckuPlayerId(l.name), name:l.name, number:l.num, pos:l.pos}; });
      UI.setup[sideN]._lineupSlots=new Array(9).fill(null); UI.setup[sideN].lineup.forEach(function(pl,i){UI.setup[sideN]._lineupSlots[i]=pl;});
      var pp=nmap[nckuPlayerId(NCKU_PITCHER.name)];
      UI.setup[sideN].pitcherOnly = {id:pp?pp.id:nckuPlayerId(NCKU_PITCHER.name), name:NCKU_PITCHER.name, number:NCKU_PITCHER.num};
      render(); break;
    }
    case 'clearPitcherOnly': UI.setup[t.dataset.side].pitcherOnly=null; render(); break;
    case 'setTeamMode': { var tm=UI.setup[t.dataset.side]; tm.mode=t.dataset.v; if(tm.mode==='roster'||tm.mode==='preset') ensureSetupLineupSlots(tm); render(); break; }
    case 'openRosterSlot': openSetupRosterPicker(t.dataset.side,+t.dataset.slot); break;
    case 'clearRosterSlot': { var rs=UI.setup[t.dataset.side]; var slc=ensureSetupLineupSlots(rs); slc[+t.dataset.slot]=null; syncSetupLineupSlots(rs); render(); break; }
    case 'chooseRosterSlot': { var rs2=UI.setup[t.dataset.side]; var rp=DB.roster.find(function(x){return x.id===t.dataset.pid;}); if(!rp) return; var sl2=ensureSetupLineupSlots(rs2); var old=sl2[+t.dataset.slot]; sl2[+t.dataset.slot]={id:rp.id,personId:rp.personId||rp.id,name:rp.name,number:rp.number,pos:(old&&old.pos)||nextOpenPos(sl2.filter(Boolean))}; syncSetupLineupSlots(rs2); closeModal(); break; }

function nextOpenPos(lineup){
  var used = lineup.map(function(p){return p.pos;});
  for(var i=0;i<POS.length;i++){ if(used.indexOf(POS[i])===-1) return POS[i]; }
  return 'P';
}

function bipPickPoint(kind, x, y){
  var d = UI.bip;
  x = round1(x); y = round1(y);
  if(kind==='landing'){ d.landing={x:x,y:y}; if(d.merged) d.trigger=d.landing; }
  else { d.trigger={x:x,y:y}; }
  d._flash = {x:x, y:y, color: kind==='landing' ? '#c0392b' : '#2255aa'};
  render();
  setTimeout(function(){
    if(!UI.bip) return;
    UI.bip._flash = null;
    if(kind==='landing'){ UI.bip.merged ? bipGo('chain') : bipGo('trigger'); }
    else { bipGo('chain'); }
  }, 220);
}

function handleFielderClick(node, ev){
  ev.stopPropagation();
  var pos = node.dataset.pos; var svgId = node.dataset.svg;
  var x = parseFloat(node.dataset.x), y = parseFloat(node.dataset.y);
  if(svgId==='bip'){
    var d = UI.bip;
    if(d.step==='landing'){ bipPickPoint('landing', x, y); return; }
    if(d.step==='trigger'){ bipPickPoint('trigger', x, y); return; }
    if(d.step==='chain'){
      var last = d.chain[d.chain.length-1];
      if(last && last.pos===pos){ last.error=!last.error; if(last.error){ last.errorType=last.errorType||'未分類'; last.errorEffect=last.errorEffect||'依跑壘結果'; } } else { d.chain.push({pos:pos, error:false, errorType:'', errorEffect:''}); }
      render(); return;
    }
    return;
  }
  if(svgId==='main' && UI.adjustDefense){ UI.pickedFielder=pos; render(); return; }
  if(node.closest('svg').dataset.mode==='preset'){ UI.pickedFielder=pos; render(); return; }
}

function handleSvgClick(svg, ev){
  var mode = svg.dataset.mode; var svgId = svg.dataset.svg;
  var rect = svg.getBoundingClientRect();
  var pt = svg.createSVGPoint ? svg.createSVGPoint() : null;
  var x,y;
  if(pt){ pt.x=ev.clientX; pt.y=ev.clientY; var ctm=svg.getScreenCTM().inverse(); var loc=pt.matrixTransform(ctm); x=loc.x; y=loc.y; }
  else { x=(ev.clientX-rect.left)/rect.width*100; y=(ev.clientY-rect.top)/rect.height*100; }
  x=Math.max(0,Math.min(100,x)); y=Math.max(0,Math.min(100,y));

  if(svgId==='bip'){
    var d = UI.bip;
    if(d.step==='landing'){ bipPickPoint('landing', x, y); }
    else if(d.step==='trigger'){ bipPickPoint('trigger', x, y); }
    return;
  }
  if(mode==='preset' && UI.pickedFielder){
    if(UI.route==='presets'){
      var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
      var svgWrap = svg.closest('.card');
      var idx = cards.indexOf(svgWrap);
      var keys = Object.keys(DB.presets);
      var key = keys[idx] || keys[0];
      if(key){ DB.presets[key].pos[UI.pickedFielder] = {x:round1(x), y:round1(y)}; saveDB(); }
      UI.pickedFielder=null; render();
    } else if(UI.route==='game' && UI.adjustDefense){
      var g=currentGame(); var fs=fieldingSideOf(g);
      captureGameUndo(g,'調整守備站位：'+UI.pickedFielder);
      g.state.defense[UI.pickedFielder]={x:round1(x), y:round1(y)};
      g.teams[fs].defense[UI.pickedFielder]={x:round1(x), y:round1(y)};
      UI.pickedFielder=null; saveDB(); render();
    }
  }
}

function confirmPickoff(){
  var g=currentGame(); var d=wizardData();
  if(!d.base||!d.result){ alert('請選擇壘包與結果'); return; }
  captureGameUndo(g,'牽制：'+d.base+'壘 '+d.result);
  var runnerId=g.state.bases[d.base];
  var basesBefore=baseSnapshot(g.state); var outsBefore=g.state.outs;
  var ev={type:'pickoff', inningBefore:g.state.inning, halfBefore:g.state.half, base:d.base, result:d.result, battingTeam:battingSideOf(g), fieldingTeam:fieldingSideOf(g), basesBefore:basesBefore, outsBefore:outsBefore};
  if(d.result==='出局'){ g.state.bases[d.base]=null; g.state.outs++; ev.summary='牽制 '+d.base+'壘 出局'; }
  else if(d.result==='安全'){ ev.summary='牽制 '+d.base+'壘 未成功'; }
  else if(d.result==='暴傳'){
    var nb = d.base==='3' ? 'score' : String(+d.base+1);
    if(nb==='score'){ addRuns(g, battingSideOf(g), 1); g.state.bases[d.base]=null; } else { g.state.bases[nb]=runnerId; g.state.bases[d.base]=null; }
    g.state.errors[fieldingSideOf(g)]=(g.state.errors[fieldingSideOf(g)]||0)+1; ev.summary='牽制暴傳,跑者推進';
  }
  ev.basesAfter=baseSnapshot(g.state); ev.outsAfter=g.state.outs;
  logEvent(g, ev); switchHalfIfNeeded(g); saveDB(); UI.wizard=null; closeModal();
}
function confirmSteal(){

  else if(d.result==='刺殺'){ g.state.bases[d.from]=null; g.state.outs++; ev.summary='盜壘刺殺出局'; }
  else if(d.result==='暴傳'){ g.state.bases[d.from]=null; if(target==='score') addRuns(g, battingSideOf(g),1); else g.state.bases[target]=runnerId; g.state.errors[fieldingSideOf(g)]=(g.state.errors[fieldingSideOf(g)]||0)+1; ev.summary='盜壘時暴傳,跑者額外推進'; }

function confirmWP(){
  var g=currentGame(); var d=wizardData();
  if(!d.kind){ alert('請選擇暴投或捕逸'); return; }
  captureGameUndo(g,d.kind);
  var basesBefore=baseSnapshot(g.state); var outsBefore=g.state.outs;
  var ev={type:'wp', kind:d.kind, inningBefore:g.state.inning, halfBefore:g.state.half, battingTeam:battingSideOf(g), fieldingTeam:fieldingSideOf(g), basesBefore:basesBefore, outsBefore:outsBefore, adv:d.adv||{}};
  var moved=[];
  ['3','2','1'].forEach(function(b){

    var a=(d.adv&&d.adv[b])||'stay';
    if(a==='score'){ addRuns(g, battingSideOf(g),1); moved.push(b+'→本壘'); g.state.bases[b]=null; }
    else if(a==='adv'){ var nb=String(+b+1); g.state.bases[nb]=g.state.bases[b]; g.state.bases[b]=null; moved.push(b+'→'+nb); }
  });
  ev.summary=d.kind+' '+moved.join(',');

  logEvent(g, ev); saveDB(); UI.wizard=null; closeModal();

function confirmSub(){
  var g=currentGame(); var d=wizardData();
  if(!d.kind){ alert('請選擇換人類型'); return; }
  var inId=d.inPlayer; if(!inId){ alert('請選擇替補球員'); return; }
  captureGameUndo(g,'換人：'+d.kind);
  var ev={type:'sub', kind:d.kind, inningBefore:g.state.inning, halfBefore:g.state.half};
  if(d.kind==='代打'){
    var side=battingSideOf(g); var idx=g.state.battingIndex[side]; var out=g.teams[side].lineup[idx];
    var inP=g.teams[side].bench.find(function(p){return p.id===inId;});
    if(inP){ inP.pos=out.pos; g.teams[side].lineup[idx]=inP; g.teams[side].bench=g.teams[side].bench.filter(function(p){return p.id!==inId;}).concat([out]); }
    ev.summary='代打:'+esc(inP?inP.name:'')+' 換下 '+esc(out.name);
    ev.outPlayerName=out.name; ev.inPlayerName=inP?inP.name:''; ev.battingIndex=idx;
  } else if(d.kind==='代跑'){
    if(!d.base){ alert('請選擇壘包'); return; }
    var side2=battingSideOf(g); var inP2=g.teams[side2].bench.find(function(p){return p.id===inId;});
    var outId2=g.state.bases[d.base]; var outName2=playerNameById(g, outId2);
    if(inP2){ g.state.bases[d.base]=inP2.id; g.teams[side2].bench=g.teams[side2].bench.filter(function(p){return p.id!==inId;}); }
    ev.summary='代跑上'+d.base+'壘:'+esc(inP2?inP2.name:'');
    ev.base=d.base; ev.outPlayerName=outName2; ev.inPlayerName=inP2?inP2.name:'';
  } else if(d.kind==='投手更換'){
    var sideP=fieldingSideOf(g); var teamP=g.teams[sideP]; var curP=teamPitcher(teamP);
    var inPitcher=teamP.bench.find(function(p){return p.id===inId;});
    if(!inPitcher){ alert('找不到要換上的投手'); return; }
    if(curP && curP.id===inPitcher.id){ alert('這位球員目前已經是投手'); return; }
    var lineupPIndex=teamP.lineup.findIndex(function(p){return p.pos==='P';});
    if(lineupPIndex>=0){
      var outPitcher=teamP.lineup[lineupPIndex];
      inPitcher.pos='P';
      teamP.lineup[lineupPIndex]=inPitcher;
      teamP.bench=teamP.bench.filter(function(p){return p.id!==inId;}).concat([outPitcher]);
      teamP.pitcherId=null;
      curP=outPitcher;
    } else {
      inPitcher.pos='P';
      teamP.pitcherId=inPitcher.id;
    }
    ev.summary='投手更換:'+esc(inPitcher.name)+' 換下 '+esc(curP?curP.name:'無');
    ev.position='P'; ev.outPlayerName=curP?curP.name:''; ev.inPlayerName=inPitcher.name;
  } else if(d.kind==='守備替換'){
    if(!d.position){ alert('請選擇守位'); return; }
    if(d.position==='P'){ alert('投手請使用「投手更換」'); return; }
    var side3=fieldingSideOf(g); var inP3=g.teams[side3].bench.find(function(p){return p.id===inId;});
    var out3=g.teams[side3].lineup.find(function(p){return p.pos===d.position;});
    if(inP3){ inP3.pos=d.position; if(out3){ g.teams[side3].lineup=g.teams[side3].lineup.map(function(p){return p.id===out3.id?inP3:p;}); g.teams[side3].bench=g.teams[side3].bench.filter(function(p){return p.id!==inId;}).concat([out3]); } else { g.teams[side3].lineup.push(inP3); g.teams[side3].bench=g.teams[side3].bench.filter(function(p){return p.id!==inId;}); } }
    ev.summary='守備替換 '+d.position+':'+esc(inP3?inP3.name:'');
    ev.position=d.position; ev.outPlayerName=out3?out3.name:''; ev.inPlayerName=inP3?inP3.name:'';
  }
  logEvent(g, ev); saveDB(); UI.wizard=null; closeModal();
}
function confirmCorrection(){
  var g=currentGame(); var d=wizardData(); var st=g.state; var chk=d.chk, val=d.val; var changed=[];
  captureGameUndo(g,'校正 / 補登');
  if(chk.outs){ st.outs=parseInt(val.outs)||0; changed.push('出局數→'+st.outs); }
  if(chk.count){ st.strikes=parseInt(val.strikes)||0; st.balls=parseInt(val.balls)||0; changed.push('好壞球→'+st.strikes+'-'+st.balls); }
  if(chk.inning){ st.inning=parseInt(val.inning)||st.inning; st.half=val.half||st.half; changed.push('局數→'+st.inning+(st.half==='top'?'上':'下')); }
  if(chk.bases){ st.bases={1:val.b1||null,2:val.b2||null,3:val.b3||null}; changed.push('壘上球員已調整'); }
  if(chk.battingIndex){ var side=battingSideOf(g); st.battingIndex[side]=parseInt(val.battingIndex)||0; changed.push('打者棒次→'+st.battingIndex[side]); }
  var ev={type:'correction', inningBefore:st.inning, halfBefore:st.half, summary:'校正:'+(changed.join('、')||'(無變更)'), fields:val, applied:chk};
  logEvent(g, ev); saveDB(); UI.wizard=null; closeModal();
}

/* ================= 記分板符號 ================= */
function errorNotation(ev){
  var errs=(ev.chain||[]).filter(function(c){return c.error;});
  return errs.length?('+E'+errs.map(function(c){return POSNUM[c.pos]||c.pos;}).join('/E')):'';
}
function buildNotation(ev){
  if(ev.batterROE || ev.outcome==='ROE') return 'E'+((ev.chain||[]).find(function(c){return c.error;})||ev.chain[0]?POSNUM[((ev.chain||[]).find(function(c){return c.error;})||ev.chain[0]).pos]:'');
  var o=ev.outcome;
  if(o==='1B') return (ev.isBunt?'觸擊安打':'1B')+errorNotation(ev);
  if(o==='2B') return '2B'+errorNotation(ev); if(o==='3B') return '3B'+errorNotation(ev); if(o==='HR') return 'HR'+errorNotation(ev);
  if(o==='ROE') return 'E'+(ev.chain[0]?POSNUM[ev.chain[0].pos]:'');
  if(o==='FC') return 'FC'+(ev.chainStr||'');
  if(o==='SF') return 'SF'+(ev.chain.length?POSNUM[ev.chain[ev.chain.length-1].pos]:'');
  if(o==='SH') return 'SH'+(ev.chain.length?POSNUM[ev.chain[ev.chain.length-1].pos]:'');
  if(o==='GIDP') return ev.chainStr||'DP';
  if(o==='一般出局'){
    if(ev.trajectory==='高飛'||ev.trajectory==='內野高飛'){ return ev.chain.length?String(POSNUM[ev.chain[0].pos]):'F'; }
    return ev.chainStr || (ev.chain.length?String(POSNUM[ev.chain[0].pos]):'U');
  }
  return o;
}
function pitchNotationForAtBat(finalEv){
  if(!finalEv) return '';
  if(finalEv.type==='battedball') return finalEv.notation||buildNotation(finalEv);
  if(finalEv.finalOutcome==='BB') return 'BB';
  if(finalEv.finalOutcome==='HBP') return 'HBP';
  if(finalEv.finalOutcome==='三振看') return 'Kc';
  if(finalEv.finalOutcome==='三振揮') return 'K';
  return finalEv.finalOutcome||'';
}
function renderNotationTable(g){
  function teamTable(side){
    var lineup=g.teams[side].lineup; var maxInning=Math.max(g.innings, g.state.inning); var perBatterInning={};
    g.events.forEach(function(ev){
      if(ev.battingTeam!==side) return;
      if(ev.type!=='battedball' && !ev.finalOutcome) return;
      var key=ev.batterId+'|'+ev.inningBefore; var note=pitchNotationForAtBat(ev); if(!note) return;
      perBatterInning[key]=perBatterInning[key]||[]; perBatterInning[key].push(note);
    });
    var head='<tr><th>棒次</th><th>球員</th>'; for(var i=1;i<=maxInning;i++) head+='<th>'+i+'</th>'; head+='</tr>';
    var rows=lineup.map(function(p,i){
      var cells=''; for(var inn=1;inn<=maxInning;inn++){ var arr=perBatterInning[p.id+'|'+inn]; cells+='<td>'+(arr?arr.join('/'):'')+'</td>'; }
      return '<tr><td>'+(i+1)+'</td><td style="text-align:left;">'+esc(p.name)+'</td>'+cells+'</tr>';
    }).join('');
    return '<h3>'+esc(g.teams[side].name)+'</h3><table>'+head+rows+'</table>';
  }
  return teamTable('away')+teamTable('home');
}
function openNotationModal(){ var g=currentGame(); openModal('<h2>記分板</h2>'+renderNotationTable(g)+'<div class="row" style="margin-top:12px;"><button class="btn primary" data-act="wCancel">關閉</button></div>'); }

/* ================= 匯出 ================= */
function flattenEvent(ev, g){
  function nm(id){ return id ? playerNameById(g, id) : ''; }
  var basesAfterSrc = ev.basesAfterPlay || ev.basesAfter;
  var outsAfterSrc = (ev.outsAfterPlay!=null) ? ev.outsAfterPlay : ev.outsAfter;
  return {
    'id': ev.id, '時間': ev.ts?new Date(ev.ts).toLocaleString():'', '局數': ev.inningBefore, '半局': ev.halfBefore==='top'?'上':'下',
    '出局數(前)': ev.outsBefore, '好球(前)': ev.strikesBefore, '壞球(前)': ev.ballsBefore,
    '一壘跑者(前)': nm(ev.basesBefore?ev.basesBefore[1]:null), '二壘跑者(前)': nm(ev.basesBefore?ev.basesBefore[2]:null), '三壘跑者(前)': nm(ev.basesBefore?ev.basesBefore[3]:null),
    '打擊方': ev.battingTeam, '守備方': ev.fieldingTeam, '打者': ev.batterName||'', '事件類型': ev.type,
    '球種': ev.pitchType||'', '進壘點(5x5格,0-24)': (ev.zone!=null?ev.zone:''), '投球結果': ev.pitchResult||'',
    '力道': ev.power||'', '軌跡': ev.trajectory||'',
    '落點X': ev.landing?ev.landing.x:'', '落點Y': ev.landing?ev.landing.y:'',
    '觸發點X': ev.trigger?ev.trigger.x:'', '觸發點Y': ev.trigger?ev.trigger.y:'',
    '處理傳球鏈': ev.chainStr||'', '打者結果': ev.outcome||ev.finalOutcome||'', '原先選擇結果': ev.selectedOutcome||'', '是否觸擊': ev.isBunt?'是':'',
    '打者因失誤上壘': ev.batterROE?'是':'',
    '失誤明細': (ev.errorDetails||[]).map(function(x){return x.pos+'｜'+x.type+'｜'+x.effect;}).join('; '),
    '打點': ev.rbi||'', '記分符號': ev.notation||'',
    '跑壘結果說明': ev.runnerPlanText||'', '此事件得分數': ev.runsThisPlay||'',
    '出局數(後)': outsAfterSrc!=null?outsAfterSrc:'',
    '一壘跑者(後)': basesAfterSrc?nm(basesAfterSrc[1]):'', '二壘跑者(後)': basesAfterSrc?nm(basesAfterSrc[2]):'', '三壘跑者(後)': basesAfterSrc?nm(basesAfterSrc[3]):'',
    '牽制盜壘目標壘': ev.base||ev.from||'', '牽制盜壘結果': ev.result||'', '暴投捕逸種類': ev.type==='wp'?ev.kind:'',
    '換人類型': ev.type==='sub'?ev.kind:'', '換人:換下': ev.outPlayerName||'', '換人:換上': ev.inPlayerName||'', '換人:對象壘或守位': ev.base||ev.position||'',
    '事件摘要': ev.summary||'', '備註': ev.type==='correction'?JSON.stringify(ev.applied):''
  };
}
function buildAtBatSummary(g){
  var rows=[];
  g.events.forEach(function(ev){
    if(!ev.batterId) return; if(ev.type!=='battedball' && !ev.finalOutcome) return;
    rows.push({'局數':ev.inningBefore,'半局':ev.halfBefore==='top'?'上':'下','打者':ev.batterName,'結果代號':pitchNotationForAtBat(ev),
      '打點':ev.rbi||0,'是否安打':['1B','2B','3B','HR'].indexOf(ev.outcome)>=0?'是':'', '備註':ev.summary||''});
  });
  return rows;
}
function buildScoreSummary(g){
  var maxInning=Math.max(g.innings, g.state.inning); var rows=[];
  ['away','home'].forEach(function(side){
    var row={'隊伍':g.teams[side].name};
    for(var i=1;i<=maxInning;i++) row['第'+i+'局']=g.state.score[side][i-1]||0;
    row['R']=g.state.score[side].reduce(function(a,b){return a+(b||0);},0);
    row['H']=g.state.hits[side]||0; row['E']=g.state.errors[side]||0;
    rows.push(row);
  });
  return rows;
}
function buildScorecardSheet(g){
  var rows=[];
  ['away','home'].forEach(function(side){
    rows.push({'隊伍':g.teams[side].name});
    var lineup=g.teams[side].lineup; var maxInning=Math.max(g.innings, g.state.inning); var perBatterInning={};
    g.events.forEach(function(ev){
      if(ev.battingTeam!==side) return; if(ev.type!=='battedball' && !ev.finalOutcome) return;
      var key=ev.batterId+'|'+ev.inningBefore; var note=pitchNotationForAtBat(ev); if(!note) return;
      perBatterInning[key]=perBatterInning[key]||[]; perBatterInning[key].push(note);
    });
    lineup.forEach(function(p,i){
      var row={'棒次':i+1,'球員':p.name};
      for(var inn=1;inn<=maxInning;inn++){ row['第'+inn+'局']=(perBatterInning[p.id+'|'+inn]||[]).join('/'); }
      rows.push(row);
    });
  });
  return rows;
}
function evalXlsxCode(code){
  try{ (0,eval)(code+'\n//# sourceURL=xlsx.full.min.js'); return typeof XLSX!=='undefined'; }catch(e){ return false; }
}
function ensureXlsxLibrary(){
  if(typeof XLSX!=='undefined') return Promise.resolve(true);
  try{ var cached=localStorage.getItem(XLSX_CACHE_KEY); if(cached && evalXlsxCode(cached)) return Promise.resolve(true); }catch(e){}
  if(typeof fetch!=='function') return Promise.resolve(false);
  return fetch(XLSX_CDN).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); }).then(function(code){
    try{ localStorage.setItem(XLSX_CACHE_KEY,code); }catch(e){}
    return evalXlsxCode(code);
  }).catch(function(){ return false; });
}
function warmXlsxCache(){
  if(typeof XLSX!=='undefined') return;
  try{ if(localStorage.getItem(XLSX_CACHE_KEY)){ ensureXlsxLibrary(); return; } }catch(e){}
  if(navigator.onLine!==false) ensureXlsxLibrary();
}
function exportXlsx(){
  var g=currentGame(); if(!g) return;
  ensureXlsxLibrary().then(function(ok){
    if(!ok){ alert('Excel 元件尚未快取。請在有網路時開啟系統一次，之後即可離線匯出；目前仍可匯出 JSON 完整保存資料。'); return; }
    var wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(g.events.map(function(ev){return flattenEvent(ev,g);})), '逐事件日誌');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildAtBatSummary(g)), '打席摘要');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildScorecardSheet(g)), '視覺化記分板');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(buildScoreSummary(g)), '比分摘要');
    var wbout=XLSX.write(wb, {bookType:'xlsx', type:'array'});
    var blob=new Blob([wbout], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
    saveFile((g.date||'game')+'_'+g.teams.away.name+'_vs_'+g.teams.home.name+'.xlsx', blob);
  });
}
function exportJson(){
  var g=currentGame(); if(!g) return;
  var blob=new Blob([JSON.stringify(g,null,2)], {type:'application/json'});
  saveFile((g.date||'game')+'_'+g.teams.away.name+'_vs_'+g.teams.home.name+'.json', blob);
}
function exportFullBackup(){
  var payload={app:'NCKU Baseball Scorekeeper',version:'3.1',exportedAt:new Date().toISOString(),db:DB};
  var blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
  saveFile('NCKU_BASEBALL_FULL_BACKUP_'+new Date().toISOString().slice(0,10)+'.json',blob);
}
function importBackupFile(file){
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var obj=JSON.parse(String(reader.result||'')); var next=obj.db||obj;
      if(!next || !Array.isArray(next.roster) || !next.games || !Array.isArray(next.order)) throw new Error('格式不符');
      if(!confirm('匯入備份會取代目前整個本機資料庫，確定繼續？')) return;
      checkpointDB('匯入備份前'); DB=next; if(!DB.presets) DB.presets=deepClone(DEFAULT_PRESETS); if(!DB.games) DB.games={}; if(!DB.order) DB.order=Object.keys(DB.games); if(!DB.roster) DB.roster=[];
      migrateNckuRosterIdentity(); saveDB(); UI.gameId=null; UI.setup=null; UI.route='start'; render(); alert('備份已復原');
    }catch(e){ alert('備份檔無法讀取：'+e.message); }
  };
  reader.readAsText(file);
}
function restoreAutoBackup(){
  var b=readAutoBackup(); if(!b||!b.db){ alert('沒有可復原的自動備份'); return; }
  var when=b.ts?new Date(b.ts).toLocaleString():'';
  if(!confirm('復原自動備份「'+(b.label||'')+'」'+(when?'（'+when+'）':'')+'？目前狀態會保留成新的安全備份。')) return;
  var current={version:1,ts:Date.now(),label:'復原前狀態',db:deepClone(DB)};
  DB=b.db; try{ localStorage.setItem(BACKUP_KEY,JSON.stringify(current)); }catch(e){}
  saveDB(); UI.gameId=null; UI.setup=null; UI.route='start'; render();
}
function isLikelyMobile(){ return /iPhone|iPad|iPod|Android/i.test(navigator.userAgent||''); }
function saveFile(filename, blob){
  var tryShare=function(){
    if(!isLikelyMobile() || !navigator.share || typeof File==='undefined') return Promise.resolve(false);
    try{
      var f=new File([blob],filename,{type:blob.type||'application/octet-stream'});
      if(navigator.canShare && !navigator.canShare({files:[f]})) return Promise.resolve(false);
      return navigator.share({files:[f],title:filename}).then(function(){return true;}).catch(function(err){ if(err&&err.name==='AbortError') return true; return false; });
    }catch(e){ return Promise.resolve(false); }
  };
  tryShare().then(function(shared){
    if(shared) return;
    if(window.claude && window.claude.use){
      claude.use('downloads').then(function(dl){
        if(!dl){ fallbackDownload(filename, blob); return; }
        dl.save({filename:filename, data:blob}).catch(function(err){ if(err && err.code==='declined') return; fallbackDownload(filename, blob); });
      }).catch(function(){ fallbackDownload(filename, blob); });
    } else fallbackDownload(filename, blob);
  });
}
function fallbackDownload(filename, blob){
  try{
    var url=URL.createObjectURL(blob); var a=document.createElement('a'); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(url);}, 2000);
  }catch(e){ alert('匯出失敗:'+e.message); }
}

/* ============ 啟動 ============ */
migrateNckuRosterIdentity();
warmXlsxCache();
render();
})();
